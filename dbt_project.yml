name: 'nyc_analytics'
version: '1.0.0'
config-version: 2
# Some default settings for dbt
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
 - "target"
 - "dbt_packages"

# Set up models, which are basically SQL files, to create tables
models:
 nyc_analytics:
   +materialized: table

   assignment_work:
     staging:
       +materialized: table
       +schema: nyc_311_staging_data_f26

     marts:
       +materialized: table
       +schema: nyc_311_marts_f26
      
       conformed:
         +materialized: table

       dob_job_filings:
         +materialized: table

       dot_311:
         +materialized: table

   project_group9_work:
     staging:
       +materialized: table
       +schema: project_group9_staging

     marts:
       +materialized: table
       +schema: project_group9_final_warehouse
      
       conformed:
         +materialized: table

       veh_crashes:
         +materialized: table

       dohmh_311:
         +materialized: table

